plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.foggyjupiter.ggomantle'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.foggyjupiter.ggomantle'
        minSdk 24
        // 35부터는 화면이 상태 표시줄 아래까지 강제로 늘어나서 34로 둔다
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        // 화면은 web/에서 가져오고(웹용 30MB 데이터 제외), 단어 데이터는 bigdata/words/
        // (tools/build_app_data.py로 생성, 용량이 커서 저장소에는 없음)
        main.assets.srcDirs = [layout.buildDirectory.dir('webassets'), 'bigdata']
    }

    androidResources {
        noCompress 'bin'
    }

    signingConfigs {
        release {
            // 서명 키는 저장소에 두지 않는다. 환경 변수가 없으면 debug 키로 서명.
            def ks = System.getenv('GGO_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('GGO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GGO_KEY_ALIAS')
                keyPassword System.getenv('GGO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('GGO_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

def syncWeb = tasks.register('syncWeb', Sync) {
    from('../../web') {
        exclude 'data/**', 'sw.js'
    }
    into layout.buildDirectory.dir('webassets')
}

def checkBigData = tasks.register('checkBigData') {
    doLast {
        if (!file('bigdata/words/vectors.bin').exists()) {
            throw new GradleException('android/app/bigdata/words/ 가 없습니다. tools/build_app_data.py를 먼저 실행하세요.')
        }
    }
}

tasks.named('preBuild') {
    dependsOn syncWeb, checkBigData
}
